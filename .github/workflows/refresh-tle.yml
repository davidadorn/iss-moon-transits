name: Refresh ISS orbit backup
# The site downloads the ISS orbit from CelesTrak in the browser; this keeps a
# recent fallback copy in data/iss.tle in case that download fails.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest ISS TLE
        run: |
          curl -sfL "https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=tle" -o /tmp/iss.tle
          grep -q '^1 25544' /tmp/iss.tle && grep -q '^2 25544' /tmp/iss.tle
          cp /tmp/iss.tle data/iss.tle
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/iss.tle
          git diff --cached --quiet || (git commit -m "Refresh ISS orbit backup" && git push)
