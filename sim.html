<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISS Transit Sky</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%23e9e3d0'/%3E%3Crect x='18' y='30' width='28' height='4' fill='%23111'/%3E%3Crect x='30' y='22' width='4' height='20' fill='%23111'/%3E%3C/svg%3E">
<style>
  :root{--panel:rgba(14,18,28,.82);--line:#2c3446;--txt:#e8ecf4;--dim:#93a0b8;--acc:#ffd36b}
  html,body{margin:0;height:100%;background:#05070d;color:var(--txt);font:13px/1.35 system-ui,Segoe UI,sans-serif;overflow:hidden}
  canvas{display:block;touch-action:none;cursor:grab}
  .panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:8px;backdrop-filter:blur(4px)}
  #info{top:10px;left:10px;width:300px;padding:10px 12px;max-height:calc(100% - 120px);overflow:auto}
  #info h1{font-size:15px;margin:0 0 6px}
  #info select{width:100%;background:#101522;color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:5px;font:inherit;margin-bottom:8px}
  .row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .row span:first-child{color:var(--dim)} .row span:last-child{text-align:right}
  #clock{font:600 22px/1.1 ui-monospace,Consolas,monospace;margin-top:8px;color:#fff}
  #tminus{font:600 15px ui-monospace,Consolas,monospace;color:var(--acc)}
  #state{margin-top:4px;color:var(--dim)}
  #bar{left:10px;right:10px;bottom:10px;padding:8px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  #bar button{background:#18202f;color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:5px 9px;font:inherit;cursor:pointer}
  #bar button:hover{background:#222c40} #bar button.on{background:#3a4c7a;border-color:#5a72b0}
  #bar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
  #slider{flex:1;min-width:160px}
  #bar label{color:var(--dim);display:flex;align-items:center;gap:4px}
  a{color:#8ec5ff}
  #help{color:var(--dim);font-size:11px;margin-top:8px}
  #toggle{float:right;background:none;border:1px solid var(--line);color:var(--dim);border-radius:5px;font:inherit;padding:0 7px;cursor:pointer}
  #info.collapsed #details,#info.collapsed #help,#info.collapsed #state{display:none}
  @media (max-width:700px){#info{width:auto;right:10px;max-height:45%;padding:8px 10px}
    #clock{font-size:17px;margin-top:4px} #tminus{font-size:13px} #bar{padding:6px;gap:4px} #bar button{padding:4px 7px}}
</style></head><body>
<canvas id="c"></canvas>
<div id="info" class="panel">
  <a id="backlink" href="index.html" style="display:block;margin-bottom:6px">&larr; New search</a><h1><button id="toggle" title="Show or hide details">details</button>ISS crossing the Moon</h1>
  <select id="ev"></select>
  <div id="details"></div>
  <div id="clock"></div>
  <div id="tminus"></div>
  <div id="state"></div>
  <div id="help">Drag to look around, scroll/pinch to zoom. Keys: Space play/pause, &larr;/&rarr; step 0.1 s (Shift = 1 s), T telescope, S sky.
  <span id="gen"></span></div>
</div>
<div id="bar" class="panel">
  <button id="play">&#9654; Play</button>
  <button id="watch" title="Jump to 3 s before the crossing and play in slow motion">Watch crossing</button>
  <button id="toStart">Pass start</button>
  <span class="sep"></span>
  <span style="color:var(--dim)">Speed</span>
  <button data-sp="0.05">0.05&times;</button><button data-sp="0.25">0.25&times;</button>
  <button data-sp="1">1&times;</button><button data-sp="10">10&times;</button><button data-sp="30">30&times;</button>
  <label><input type="checkbox" id="slowmo" checked>slow-mo at Moon</label>
  <span class="sep"></span>
  <button id="vSky">Sky</button><button id="vTel">Telescope</button>
  <label><input type="checkbox" id="follow" checked>follow Moon</label>
  <input type="range" id="slider" step="0.01">
</div>
<div id="loading" class="panel" style="top:50%;left:50%;transform:translate(-50%,-50%);padding:18px 22px;text-align:center">
  <div id="ltext">Computing the sky&hellip;</div></div>
<script src="vendor/satellite.min.js"></script>
<script src="vendor/astronomy.browser.min.js"></script>
<script src="core.js"></script>
<script src="common.js"></script>
<script>
(async () => {
  const u = new URLSearchParams(location.search), say = t => document.getElementById('ltext').textContent = t;
  const info = document.getElementById('info');
  if (innerWidth < 700) info.classList.add('collapsed');
  document.getElementById('toggle').onclick = () => info.classList.toggle('collapsed');
  try {
    const home = (u.get('h') || '0,0').split(',').map(Number);
    const tz = u.get('tz') || Intl.DateTimeFormat().resolvedOptions().timeZone;
    const spots = (u.get('e') || '').split(';').filter(Boolean).map(s => { const [t, lat, lon, el, hw] = s.split(',').map(Number);
      return {jd: TC.jdOfMs(t * 1000), lat, lon, elevKm: (el || 0) / 1000, halfWidth: hw || 0}; });
    if (!spots.length) throw new Error('No transit given. Start from the search page.');
    const back = u.get('back');
    document.getElementById('backlink').href = 'index.html' + (back ? '?' + back : '');
    say('Downloading the ISS orbit\u2026');
    const [tle, sky] = await Promise.all([getTLE(), fetch('data/sky.json').then(r => r.json())]);
    const eng = new TC.Engine(tle.l1, tle.l2);
    document.getElementById('gen').textContent = `ISS orbit data ${tleAgeDays(tle.l1, tle.l2).toFixed(1)} days old (${tle.source}).`;
    const EV = [];
    for (let k = 0; k < spots.length; k++) {
      say(`Computing the sky for event ${k + 1} of ${spots.length}\u2026`);
      await new Promise(r => setTimeout(r, 0));
      EV.push(TC.simData(eng, spots[k], home, tz, sky));
    }
    window.__EV = EV; window.__HOME = home;
    const s = document.createElement('script'); s.src = 'sim-view.js';
    s.onload = () => { const i = +u.get('i'); if (i > 0 && i < EV.length) { const sel = document.getElementById('ev'); sel.value = i; sel.onchange(); }
                       document.getElementById('loading').remove(); };
    document.body.appendChild(s);
  } catch (ex) { say(ex.message || String(ex)); }
})();
</script></body></html>
